<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .task-card { transition: all 0.2s ease; }
    .task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .filter-pill { padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; white-space: nowrap; }
    .filter-pill.active { background: #6366f1; color: white; }
    .filter-pill:not(.active) { background: #f3f4f6; color: #4b5563; }
    .filter-pill:not(.active):hover { background: #e5e7eb; }
    .checked-item { text-decoration: line-through; color: #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="dashboardApp()">
  <div class="sticky top-0 bg-white border-b border-gray-100 z-10">
    <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
      <h1 class="text-lg font-bold text-gray-800">TaskFlow</h1>
      <div class="flex items-center gap-3">
        <button @click="logout" class="text-xs text-gray-400 hover:text-gray-600">Logout</button>
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-semibold text-sm" x-text="initial"></div>
      </div>
    </div>
  </div>

  <div class="max-w-lg mx-auto px-4 pb-8">
    <div class="mt-4 mb-3">
      <div @click="createTask" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition cursor-pointer">
        <p class="text-sm text-gray-400">Buat catatan baru...</p>
      </div>
    </div>

    <div class="mb-4 overflow-x-auto">
      <div class="flex gap-2">
        <template x-for="f in filters" :key="f.value">
          <button class="filter-pill text-xs" :class="{ 'active': filter === f.value }" @click="filter = f.value" x-text="f.label"></button>
        </template>
      </div>
    </div>

    <div class="space-y-3">
      <template x-for="task in filteredTasks" :key="task.id">
        <div class="task-card rounded-xl p-4 border shadow-sm" :class="cardBg(task.state)">
          <div class="flex items-start justify-between mb-2">
            <h3 class="font-semibold text-gray-800 text-sm" x-text="task.title || 'Task'"></h3>
            <span class="status-pill px-2.5 py-0.5 rounded-full text-xs font-medium" :class="statusBg(task.state)" x-text="capitalize(task.state)"></span>
          </div>
          <div class="text-xs text-gray-500 mb-3" x-html="task.content"></div>
          <template x-if="task.state === 'delegate' && task.contacts && task.contacts.length">
            <div class="mb-3">
              <template x-for="c in task.contacts" :key="c.id">
                <a :href="'https://wa.me/' + c.phone.replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent('Task: ' + (task.title || 'Task') + '\n' + task.content)"
                  target="_blank"
                  class="flex items-center gap-2 text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-lg hover:bg-green-200 transition mb-1.5 block">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  <span x-text="'Kirim ke ' + c.name + ' via WA'"></span>
                </a>
              </template>
            </div>
          </template>
          <div class="flex items-center justify-between">
            <div class="flex gap-1">
              <template x-for="s in ['todo','doing','delegate','done']" :key="s">
                <button @click="changeState(task, s)" class="w-6 h-6 rounded flex items-center justify-center text-xs cursor-pointer hover:opacity-80" :class="stateBtnBg(s)" x-text="s === 'done' ? '✓' : '→'"></button>
              </template>
            </div>
            <button @click="editTask(task.id)" class="text-xs text-gray-400 hover:text-indigo-500">Edit</button>
          </div>
        </div>
      </template>
      <div x-show="filteredTasks.length === 0" class="text-center py-12 text-gray-400 text-sm">
        Belum ada task <span x-text="filter !== 'semua' ? 'dengan status ini' : ''"></span>
      </div>
    </div>
  </div>

  <div x-show="deleteConfirm" class="fixed inset-0 bg-black/30 flex items-center justify-center z-20">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-xl">
      <p class="text-sm font-medium text-gray-700 mb-4">Task selesai. Hapus task ini?</p>
      <div class="flex gap-2">
        <button @click="deleteConfirm = null" class="flex-1 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition font-medium">Tidak</button>
        <button @click="confirmDelete" class="flex-1 py-2.5 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600 transition">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        tasks: [],
        filter: 'semua',
        filters: [
          { label: 'Semua', value: 'semua' },
          { label: 'Todo', value: 'todo' },
          { label: 'Doing', value: 'doing' },
          { label: 'Delegate', value: 'delegate' },
          { label: 'Done', value: 'done' }
        ],
        deleteConfirm: null,
        initial: '',
        get filteredTasks() {
          if (this.filter === 'semua') return this.tasks;
          return this.tasks.filter(t => t.state === this.filter);
        },
        init() {
          this.checkAuth();
          this.fetchTasks();
        },
        checkAuth() {
          fetch('api/session.php')
            .then(res => res.json())
            .then(data => {
              if (!data.authenticated) window.location.href = 'login.html';
              else if (data.user?.username) this.initial = data.user.username[0].toUpperCase();
            });
        },
        fetchTasks() {
          fetch('api/tasks/list.php')
            .then(res => res.json())
            .then(data => {
              if (data.data) {
                this.tasks = data.data;
                this.tasks.forEach(t => this.loadContacts(t));
              }
            });
        },
        loadContacts(task) {
          fetch('api/tasks/contacts.php?task_id=' + task.id)
            .then(res => res.json())
            .then(data => {
              if (data.data) task.contacts = data.data;
            });
        },
        createTask() {
          window.location.href = 'task.html';
        },
        editTask(id) {
          window.location.href = 'task.html?id=' + id;
        },
        changeState(task, newState) {
          if (newState === 'done') {
            this.deleteConfirm = task;
            return;
          }
          fetch('api/tasks/update.php', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: task.id, state: newState })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              task.state = newState;
            }
          });
        },
        confirmDelete() {
          if (!this.deleteConfirm) return;
          fetch('api/tasks/delete.php', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: this.deleteConfirm.id })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              this.tasks = this.tasks.filter(t => t.id !== this.deleteConfirm.id);
              this.deleteConfirm = null;
            }
          });
        },
        logout() {
          fetch('api/logout.php', { method: 'POST' })
            .then(() => { window.location.href = 'login.html'; });
        },
        capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); },
        cardBg(state) {
          const colors = { todo: 'bg-amber-50 border-amber-100', doing: 'bg-blue-50 border-blue-100', delegate: 'bg-purple-50 border-purple-100', done: 'bg-emerald-50 border-emerald-100 opacity-70' };
          return colors[state] || colors.todo;
        },
        statusBg(state) {
          const colors = { todo: 'bg-amber-200 text-amber-800', doing: 'bg-blue-200 text-blue-800', delegate: 'bg-purple-200 text-purple-800', done: 'bg-emerald-200 text-emerald-800' };
          return colors[state] || colors.todo;
        },
        stateBtnBg(state) {
          const colors = { todo: 'bg-amber-200/50 hover:bg-amber-300/50', doing: 'bg-blue-200/50 hover:bg-blue-300/50', delegate: 'bg-purple-200/50 hover:bg-purple-300/50', done: 'bg-emerald-200/50 hover:bg-emerald-300/50' };
          return colors[state] || colors.todo;
        }
      }
    }
  </script>
</body>
</html>
