<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">TaskFlow</h1>
      <p class="text-sm text-gray-400 mt-1">Atur tugasmu, selesaikan tepat waktu</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 p-6 border border-gray-100">
      <form class="space-y-4" @submit.prevent>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Email</label>
          <input type="email" placeholder="nama@email.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm bg-gray-50/50">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1.5">Password</label>
          <input type="password" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm bg-gray-50/50">
        </div>
        <button type="submit"
          class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:from-indigo-600 hover:to-purple-700 transition shadow-md shadow-indigo-200/50">
          Masuk
        </button>
      </form>

      <p class="text-center text-sm text-gray-400 mt-6">
        Belum punya akun? <a href="#" class="text-indigo-500 font-medium hover:text-indigo-600">Daftar</a>
      </p>

      <div class="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-100">
        <p class="text-xs text-gray-400 font-medium mb-2">🔑 AKUN DEMO</p>
        <p class="text-xs text-gray-500">Email: demo@taskflow.app</p>
        <p class="text-xs text-gray-500">Pass: demo123</p>
      </div>
    </div>
  </div>
</body>
</html>
