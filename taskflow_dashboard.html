<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .task-card { transition: all 0.2s ease; }
    .task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .filter-pill {
      padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s; border: none; white-space: nowrap;
    }
    .filter-pill.active { background: #6366f1; color: white; }
    .filter-pill:not(.active) { background: #f3f4f6; color: #4b5563; }
    .filter-pill:not(.active):hover { background: #e5e7eb; }
    .status-pill { padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .checked-item { text-decoration: line-through; color: #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="{ filter: 'semua' }">
  <!-- Top Bar -->
  <div class="sticky top-0 bg-white border-b border-gray-100 z-10">
    <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
      <h1 class="text-lg font-bold text-gray-800">TaskFlow</h1>
      <div class="flex items-center gap-3">
        <button class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-semibold text-sm">A</div>
      </div>
    </div>
  </div>

  <div class="max-w-lg mx-auto px-4 pb-8">
    <!-- Add Task -->
    <div class="mt-4 mb-3">
      <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition cursor-pointer">
        <p class="text-sm text-gray-400">Buat catatan baru...</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="mb-4 overflow-x-auto">
      <div class="flex gap-2">
        <template x-for="f in ['semua','todo','doing','delegate','done']" :key="f">
          <button class="filter-pill text-xs"
            :class="{ 'active': filter === f }"
            @click="filter = f"
            x-text="f.charAt(0).toUpperCase() + f.slice(1)"></button>
        </template>
      </div>
    </div>

    <!-- Task Grid -->
    <div class="space-y-3">
      <!-- Card 1: Todo -->
      <div class="task-card bg-amber-50 rounded-xl p-4 border border-amber-100 shadow-sm">
        <h3 class="font-semibold text-gray-800 text-sm mb-1">Belanja Bulanan</h3>
        <p class="text-xs text-gray-500 mb-3">Beli kebutuhan dapur dan <strong>bahan masakan</strong> untuk seminggu</p>
        <div class="flex items-center justify-between">
          <span class="status-pill bg-amber-200 text-amber-800">Todo</span>
          <div class="flex gap-1">
            <span class="w-6 h-6 rounded bg-amber-200/50 flex items-center justify-center text-xs cursor-pointer hover:bg-amber-300/50">→</span>
          </div>
        </div>
      </div>

      <!-- Card 2: Doing -->
      <div class="task-card bg-blue-50 rounded-xl p-4 border border-blue-100 shadow-sm">
        <h3 class="font-semibold text-gray-800 text-sm mb-1">Desain Landing Page</h3>
        <div class="space-y-1.5 mb-3">
          <label class="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" checked class="mt-0.5 accent-blue-500">
            <span class="text-xs text-gray-500 checked-item">Buat wireframe homepage</span>
          </label>
          <label class="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" class="mt-0.5 accent-blue-500">
            <span class="text-xs text-gray-600">Desain komponen UI di Figma</span>
          </label>
          <label class="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" class="mt-0.5 accent-blue-500">
            <span class="text-xs text-gray-600">Revisi sesuai feedback klien</span>
          </label>
        </div>
        <div class="flex items-center justify-between">
          <span class="status-pill bg-blue-200 text-blue-800">Doing</span>
          <div class="flex gap-1">
            <span class="w-6 h-6 rounded bg-blue-200/50 flex items-center justify-center text-xs cursor-pointer hover:bg-blue-300/50">→</span>
          </div>
        </div>
      </div>

      <!-- Card 3: Delegate -->
      <div class="task-card bg-purple-50 rounded-xl p-4 border border-purple-100 shadow-sm">
        <h3 class="font-semibold text-gray-800 text-sm mb-1">Kirim Invoice Proyek</h3>
        <p class="text-xs text-gray-500 mb-2">Invoice bulan Maret untuk PT Maju Jaya</p>
        <button class="flex items-center gap-2 text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-lg hover:bg-green-200 transition mb-3">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Kirim ke Andi via WA
        </button>
        <div class="flex items-center justify-between">
          <span class="status-pill bg-purple-200 text-purple-800">Delegate</span>
          <div class="flex gap-1">
            <span class="w-6 h-6 rounded bg-purple-200/50 flex items-center justify-center text-xs cursor-pointer hover:bg-purple-300/50">→</span>
          </div>
        </div>
      </div>

      <!-- Card 4: Done -->
      <div class="task-card bg-emerald-50 rounded-xl p-4 border border-emerald-100 shadow-sm opacity-70">
        <h3 class="font-semibold text-gray-800 text-sm mb-1">Review Dokumen Kontrak</h3>
        <p class="text-xs text-gray-400 line-through mb-3">Periksa klausul dan tanda tangan kontrak</p>
        <div class="flex items-center justify-between">
          <span class="status-pill bg-emerald-200 text-emerald-800">Done</span>
          <div class="flex gap-1">
            <span class="w-6 h-6 rounded bg-emerald-200/50 flex items-center justify-center text-xs cursor-pointer hover:bg-emerald-300/50">✓</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
