<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow — Task Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .checked-item { text-decoration: line-through; color: #9ca3af; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="{ showContactModal: false, showColorPicker: false, selectedColor: 'bg-amber-50' }">

  <!-- Top Bar -->
  <div class="sticky top-0 bg-white border-b border-gray-100 z-10">
    <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
      <button class="text-gray-400 hover:text-gray-600 p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="text-sm font-semibold text-gray-700">Edit Task</h1>
      <button class="text-gray-400 hover:text-red-500 p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Editor -->
  <div class="max-w-lg mx-auto px-4 pb-8 mt-4">
    <div class="rounded-2xl border border-gray-100 shadow-sm overflow-hidden" :class="selectedColor">
      <div class="p-5">
        <!-- Title -->
        <input type="text" value="Desain Landing Page"
          class="w-full text-lg font-semibold bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 mb-4"
          placeholder="Judul task...">

        <!-- Toolbar -->
        <div class="flex items-center gap-1 mb-4 pb-3 border-b border-gray-200/50">
          <button class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-gray-600 hover:bg-black/5">B</button>
          <button class="w-8 h-8 rounded-lg flex items-center justify-center text-sm italic text-gray-600 hover:bg-black/5">I</button>
          <button class="w-8 h-8 rounded-lg flex items-center justify-center text-sm underline text-gray-600 hover:bg-black/5">U</button>
          <span class="w-px h-5 bg-gray-200 mx-1"></span>
          <button class="w-8 h-8 rounded-lg flex items-center justify-center text-xs text-gray-600 hover:bg-black/5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
          <button class="w-8 h-8 rounded-lg flex items-center justify-center text-xs text-gray-600 hover:bg-black/5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
            </svg>
          </button>
          <span class="w-px h-5 bg-gray-200 mx-1"></span>
          <!-- Color Picker -->
          <div class="relative">
            <button @click="showColorPicker = !showColorPicker"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-xs text-gray-600 hover:bg-black/5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
              </svg>
            </button>
            <div x-show="showColorPicker" @click.outside="showColorPicker = false"
              class="absolute top-10 left-0 bg-white rounded-xl shadow-lg border p-2 flex gap-1 z-10">
              <template x-for="c in ['bg-amber-50','bg-blue-50','bg-emerald-50','bg-red-50','bg-purple-50','bg-pink-50','bg-gray-50','bg-white']">
                <div class="w-7 h-7 rounded-lg cursor-pointer border border-gray-200 hover:scale-110 transition"
                  :class="c"
                  @click="selectedColor = c; showColorPicker = false"></div>
              </template>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="space-y-2 mb-5">
          <p class="text-sm text-gray-600">Buat <strong>wireframe</strong> homepage dulu ya</p>
          <label class="flex items-start gap-2 cursor-pointer group">
            <input type="checkbox" checked class="mt-0.5 accent-indigo-500">
            <span class="text-sm text-gray-400 checked-item">Buat wireframe homepage</span>
          </label>
          <label class="flex items-start gap-2 cursor-pointer group">
            <input type="checkbox" class="mt-0.5 accent-indigo-500">
            <span class="text-sm text-gray-600">Desain komponen UI di Figma</span>
          </label>
          <label class="flex items-start gap-2 cursor-pointer group">
            <input type="checkbox" class="mt-0.5 accent-indigo-500">
            <span class="text-sm text-gray-600">Revisi sesuai feedback klien</span>
          </label>
          <label class="flex items-start gap-2 cursor-pointer group">
            <input type="checkbox" class="mt-0.5 accent-indigo-500">
            <span class="text-sm text-gray-600">Persiapkan file export untuk developer</span>
          </label>
        </div>

        <!-- Contact -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-400">KONTAK TERLIBAT</span>
            <button @click="showContactModal = true" class="text-xs text-indigo-500 hover:text-indigo-600 font-medium">+ Tambah</button>
          </div>
          <div class="flex items-center gap-3 bg-white/60 rounded-xl p-3 border border-gray-100">
            <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xs font-semibold">A</div>
            <div>
              <p class="text-sm font-medium text-gray-700">Andi Pratama</p>
              <p class="text-xs text-gray-400">+62 812-3456-7890</p>
            </div>
          </div>
        </div>

        <!-- Status Buttons -->
        <div class="flex gap-2 flex-wrap mb-4">
          <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-200/70 text-amber-800 hover:bg-amber-300/70 transition">Todo</button>
          <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-200/70 text-blue-800 hover:bg-blue-300/70 transition">Doing</button>
          <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-purple-200/70 text-purple-800 hover:bg-purple-300/70 transition">Delegate</button>
          <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-200/70 text-emerald-800 hover:bg-emerald-300/70 transition">Done</button>
        </div>

        <!-- WhatsApp Delegate Button -->
        <button class="w-full flex items-center justify-center gap-2 bg-green-50 text-green-700 border border-green-200 px-4 py-3 rounded-xl hover:bg-green-100 transition text-sm font-medium mb-4">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Kirim ke Andi via WhatsApp
        </button>

        <!-- Delete Confirmation -->
        <div class="p-4 bg-red-50 border border-red-200 rounded-xl">
          <p class="text-sm font-medium text-red-700 mb-3">Tugas selesai. Hapus task ini?</p>
          <div class="flex gap-2">
            <button class="flex-1 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition font-medium">Tidak</button>
            <button class="flex-1 py-2.5 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600 transition">Ya, Hapus</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div x-show="showContactModal" class="fixed inset-0 bg-black/30 flex items-end justify-center z-20"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-y-full"
       x-transition:enter-end="translate-y-0">
    <div class="bg-white rounded-t-2xl w-full max-w-lg p-6">
      <h3 class="font-semibold text-gray-800 mb-4">Tambah Kontak</h3>
      <div class="space-y-3">
        <input type="text" placeholder="Nama kontak"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 outline-none text-sm bg-gray-50/50">
        <input type="text" placeholder="Nomor HP (contoh: 628123456789)"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 outline-none text-sm bg-gray-50/50">
        <button class="w-full py-3 bg-indigo-500 text-white font-medium rounded-xl hover:bg-indigo-600 transition text-sm">
          Simpan Kontak
        </button>
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
          <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-gray-400">atau</span></div>
        </div>
        <button class="w-full py-2.5 border border-gray-200 text-gray-600 font-medium rounded-xl hover:bg-gray-50 transition text-sm flex items-center justify-center gap-2">
          📱 Buku Kontak HP
        </button>
      </div>
    </div>
  </div>
</body>
</html>
