<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Task</title>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', Arial, sans-serif; }
    .checked-item { text-decoration: line-through; color: #9ca3af; }
    [contenteditable]:focus { outline: none; }
    html.dark { background-color: #202124 !important; }
    html.dark body { background-color: #202124 !important; }
    .dark .sticky.top-0 { background-color: #202124 !important; border-bottom-color: #3c4043 !important; }
    .dark .text-gray-400 { color: #9aa0a6 !important; }
    .dark .text-gray-700 { color: #e8eaed !important; }
    .dark .text-gray-600 { color: #e0e0e0 !important; }
    .dark .text-gray-800 { color: #e8eaed !important; }
    .dark .text-gray-900 { color: #fff !important; }
    .dark .border-gray-100 { border-color: #3c4043 !important; }
    .dark .border-gray-200 { border-color: #3c4043 !important; }
    .dark .bg-white { background-color: #202124 !important; }
    .dark input.bg-transparent { color: #e8eaed; }
    .dark [contenteditable] { color: #e0e0e0; }
    .dark .rounded-\[8px\].border { background: #333 !important; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="taskApp()">
  <div class="sticky top-0 bg-white border-b border-gray-100 z-10">
    <div class="flex items-center justify-between px-4 py-3 max-w-lg mx-auto">
      <div class="flex items-center gap-2">
      <button @click="goBack" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="text-sm font-semibold text-gray-700" x-text="taskId ? 'Edit Task' : 'Buat Task'"></h1>
    </div>
    <button @click="toggleTheme" class="w-10 h-10 rounded-lg flex items-center justify-center text-gray-500 hover:bg-black/5 dark:hover:bg-white/10 transition shrink-0" title="Toggle tema">
      <svg x-show="theme === 'light'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
      <svg x-show="theme === 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
    </button>
  </div>

  <div class="max-w-lg mx-auto px-4 pb-8 mt-4">
    <div class="rounded-[8px] border border-gray-100 shadow-sm overflow-hidden" :class="selectedColor">
      <div class="p-5">
        <input type="text" x-model="title"
          class="w-full text-[22px] font-normal bg-transparent border-none outline-none text-[#202124] dark:text-[#e8eaed] placeholder-gray-400 mb-4"
          placeholder="Judul task...">

        <div class="flex gap-2 flex-wrap mb-4">
          <template x-for="s in states" :key="s.value">
            <button @click="changeState(s.value)"
              class="px-3 py-1.5 rounded-lg text-xs font-medium transition"
              :class="stateClasses(s.value)"
              x-text="s.label"></button>
          </template>
        </div>

        <div class="space-y-2 mb-5">
          <div contenteditable="true" id="contentEditor"
            class="text-sm text-[#3c4043] dark:text-[#e0e0e0] min-h-[80px] leading-[1.43]"
            @input="updateContent"></div>

          <template x-for="(item, idx) in checklistItems" :key="idx">
            <label class="flex items-start gap-2 cursor-pointer group">
              <input type="checkbox" x-model="item.checked" class="mt-0.5 accent-indigo-500 shrink-0">
              <span x-show="!item.editing" @dblclick="item.editing = true"
                class="text-sm flex-1" :class="{'text-gray-400 checked-item': item.checked, 'text-gray-600': !item.checked}"
                x-text="item.text"></span>
              <input x-show="item.editing" x-model="item.text"
                @blur="item.editing = false" @keydown.enter="item.editing = false"
                class="text-sm bg-transparent border-b border-gray-300 outline-none flex-1">
              <button @click="removeChecklist(idx)" class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-red-500 p-0.5 shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </label>
          </template>
        </div>

        <div class="flex items-center gap-1 mb-4 pb-3 border-b border-gray-200/50 dark:border-gray-600/50">
          <button @click="execCmd('bold')" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-gray-600 hover:bg-black/5">B</button>
          <button @click="execCmd('italic')" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm italic text-gray-600 hover:bg-black/5">I</button>
          <button @click="execCmd('underline')" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm underline text-gray-600 hover:bg-black/5">U</button>
          <span class="w-px h-5 bg-gray-200 mx-1"></span>
          <button @click="addChecklistItem" class="w-8 h-8 rounded-lg flex items-center justify-center text-xs text-gray-600 hover:bg-black/5" title="Checklist">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>

        <!-- Labels -->
        <div class="mb-4" x-show="taskId">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-400 dark:text-gray-500">LABEL</span>
            <button @click="showLabelModal = true" class="text-xs text-indigo-500 hover:text-indigo-600 font-medium">+ Atur</button>
          </div>
          <div class="flex gap-1.5 flex-wrap" x-show="taskLabels.length > 0">
            <template x-for="l in taskLabels" :key="l.id">
              <span class="inline-block px-2 py-0.5 rounded text-[10px] font-medium text-white" :style="'background:' + l.color" x-text="l.name"></span>
            </template>
          </div>
          <p x-show="taskLabels.length === 0" class="text-xs text-gray-400">Belum ada label</p>
        </div>

        <div class="mb-5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-400 dark:text-gray-500">KONTAK TERLIBAT</span>
            <button @click="showContactModal = true" class="text-xs text-indigo-500 hover:text-indigo-600 font-medium">+ Tambah</button>
          </div>
          <template x-if="contacts.length === 0">
            <p class="text-xs text-gray-400">Belum ada kontak</p>
          </template>
          <template x-for="(c, idx) in contacts" :key="c.id">
              <div class="flex items-center gap-3 bg-white/60 dark:bg-gray-700/60 rounded-xl p-3 border border-gray-100 dark:border-gray-600 mb-2">
              <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xs font-semibold" x-text="c.name[0]"></div>
              <div class="flex-1">
                <p class="text-sm font-medium text-gray-700 dark:text-gray-200" x-text="c.name"></p>
                <p class="text-xs text-gray-400" x-text="c.phone"></p>
              </div>
              <button @click="removeContact(idx)" class="text-xs text-red-400 hover:text-red-600">Hapus</button>
            </div>
          </template>
        </div>

        <div class="flex items-center justify-end mb-3">
          <div class="relative" @click.outside="openMenu = false">
            <button @click.stop="openMenu = !openMenu" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-black/5 transition">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
              </svg>
            </button>
            <div x-show="openMenu"
              class="absolute bottom-full right-0 mb-1 bg-white dark:bg-[#333] rounded-xl shadow-lg border border-gray-100 dark:border-gray-600 py-1 w-44 z-30 text-sm">
              <button @click="showLabelModal = true; openMenu = false" class="w-full px-4 py-2.5 text-left text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 flex items-center gap-2.5 text-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                Label
              </button>
              <button @click="copyCurrentTask" class="w-full px-4 py-2.5 text-left text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 flex items-center gap-2.5 text-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Salin
              </button>
              <button @click="deleteTask" class="w-full px-4 py-2.5 text-left text-red-600 hover:bg-red-50 flex items-center gap-2.5 text-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Hapus
              </button>
            </div>
          </div>
        </div>

        <button @click="saveTask"
          class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:from-indigo-600 hover:to-purple-700 transition shadow-md shadow-indigo-200/50 text-sm">
          Simpan Task
        </button>
      </div>
    </div>
  </div>

  <!-- Label modal -->
  <div x-show="showLabelModal" class="fixed inset-0 bg-black/30 flex items-end justify-center z-20"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-y-full"
       x-transition:enter-end="translate-y-0"
       @click.self="showLabelModal = false">
    <div class="bg-white dark:bg-[#333] rounded-t-2xl w-full max-w-lg p-6 max-h-[70vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-800 dark:text-gray-100">Atur Label</h3>
        <button @click="showLabelModal = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="flex gap-2 flex-wrap mb-4">
        <template x-for="l in allLabels" :key="l.id">
          <button @click="toggleLabel(l)"
            class="px-3 py-1.5 rounded-lg text-xs font-medium border transition flex items-center gap-1.5"
            :class="isLabelActive(l) ? 'text-white border-transparent' : 'text-gray-600 border-gray-200 hover:border-gray-300'"
            :style="isLabelActive(l) ? 'background:' + l.color : ''">
            <span class="w-2 h-2 rounded-full inline-block" :style="'background:' + l.color"></span>
            <span x-text="l.name"></span>
          </button>
        </template>
      </div>
      <div class="relative my-3">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-600"></div></div>
        <div class="relative flex justify-center"><span class="bg-white dark:bg-[#333] px-3 text-xs text-gray-400">Buat label baru</span></div>
      </div>
      <div class="flex gap-2">
        <input type="text" x-model="newLabelName" @keydown.enter="createLabel" placeholder="Nama label..."
          class="flex-1 px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 text-sm outline-none focus:border-indigo-400">
        <select x-model="newLabelColor" class="px-2 py-2 rounded-lg border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 text-sm outline-none">
          <option value="#6366f1">Indigo</option>
          <option value="#ef4444">Merah</option>
          <option value="#f97316">Jingga</option>
          <option value="#eab308">Kuning</option>
          <option value="#22c55e">Hijau</option>
          <option value="#06b6d4">Cyan</option>
          <option value="#a855f7">Ungu</option>
          <option value="#ec4899">Pink</option>
        </select>
        <button @click="createLabel" class="px-3 py-2 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600">+</button>
      </div>
    </div>
  </div>

  <div x-show="showContactModal" class="fixed inset-0 bg-black/30 flex items-end justify-center z-20"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-y-full"
       x-transition:enter-end="translate-y-0">
    <div class="bg-white dark:bg-[#333] rounded-t-2xl w-full max-w-lg p-6">
      <h3 class="font-semibold text-gray-800 dark:text-gray-100 mb-4">Tambah Kontak</h3>
      <div class="space-y-3">
        <input type="text" x-model="newContact.name" placeholder="Nama kontak"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 focus:border-indigo-400 outline-none text-sm bg-gray-50/50 dark:bg-gray-700/50">
        <input type="text" x-model="newContact.phone" placeholder="Nomor HP (contoh: 628123456789)"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 focus:border-indigo-400 outline-none text-sm bg-gray-50/50 dark:bg-gray-700/50">
        <button @click="addContact" class="w-full py-3 bg-indigo-500 text-white font-medium rounded-xl hover:bg-indigo-600 transition text-sm">
          Simpan Kontak
        </button>
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-600"></div></div>
          <div class="relative flex justify-center"><span class="bg-white dark:bg-[#333] px-3 text-xs text-gray-400">atau</span></div>
        </div>
        <button @click="importFromPhone" class="w-full py-2.5 border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 font-medium rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition text-sm flex items-center justify-center gap-2">
          Buku Kontak HP
        </button>
        <button @click="showContactModal = false" class="w-full py-2 text-xs text-gray-400 hover:text-gray-600">Batal</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast.show" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-4 opacity-0" x-transition:enter-end="translate-y-0 opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100" x-transition:leave-end="translate-y-4 opacity-0"
    class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-sm font-medium shadow-lg"
    :class="toast.type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white'"
    x-text="toast.message">
  </div>

  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
  </script>
  <script>
    function taskApp() {
      const params = new URLSearchParams(window.location.search);
      return {
        taskId: params.get('id'),
        title: '',
        state: 'todo',
        selectedColor: 'bg-amber-50',
        checklistItems: [],
        contacts: [],
        newContact: { name: '', phone: '' },
        showContactModal: false,
        taskLabels: [],
        allLabels: [],
        showLabelModal: false,
        openMenu: false,
        theme: localStorage.getItem('theme') || 'light',
        toast: { show: false, message: '', type: 'success' },
        newLabelName: '',
        newLabelColor: '#6366f1',
        _nextIdx: 0,
        states: [
          { label: 'Todo', value: 'todo' },
          { label: 'Doing', value: 'doing' },
          { label: 'Delegate', value: 'delegate' },
          { label: 'Done', value: 'done' }
        ],
        stateColors: {
          todo: { card: 'bg-amber-50', btn: 'bg-amber-200/70 text-amber-800 hover:bg-amber-300/70' },
          doing: { card: 'bg-blue-50', btn: 'bg-blue-200/70 text-blue-800 hover:bg-blue-300/70' },
          delegate: { card: 'bg-purple-50', btn: 'bg-purple-200/70 text-purple-800 hover:bg-purple-300/70' },
          done: { card: 'bg-emerald-50', btn: 'bg-emerald-200/70 text-emerald-800 hover:bg-emerald-300/70' }
        },
        init() {
          if (this.taskId) {
            fetch('api/tasks/list.php')
              .then(res => res.json())
              .then(data => {
                if (data.data) {
                  const task = data.data.find(t => String(t.id) === this.taskId);
                  if (task) {
                    this.loadTask(task);
                    this.loadContacts();
                    this.loadLabels();
                  }
                }
              });
          }
        },
        loadLabels() {
          fetch('api/labels.php')
            .then(res => res.json())
            .then(data => { if (data.data) this.allLabels = data.data; });
          if (this.taskId) {
            fetch('api/labels.php?task_id=' + this.taskId)
              .then(res => res.json())
              .then(data => { if (data.data) this.taskLabels = data.data; });
          }
        },
        isLabelActive(label) {
          return this.taskLabels.some(l => l.id === label.id);
        },
        toggleLabel(label) {
          const attached = this.isLabelActive(label);
          fetch('api/labels.php?toggle=1', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: parseInt(this.taskId), label_id: label.id })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              if (attached) {
                this.taskLabels = this.taskLabels.filter(l => l.id !== label.id);
                this.showToast('Label dihapus', 'success');
              } else {
                this.taskLabels.push({ id: label.id, name: label.name, color: label.color });
                this.showToast('Label ditambahkan', 'success');
              }
            }
          });
        },
        showToast(msg, type) {
          this.toast = { show: true, message: msg, type: type || 'success' };
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => { this.toast.show = false; }, 3000);
        },
        createLabel() {
          const name = this.newLabelName.trim();
          if (!name) return;
          fetch('api/labels.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, color: this.newLabelColor })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              this.allLabels.push(data.data);
              this.newLabelName = '';
            } else {
              this.showToast(data.message || 'Gagal membuat label', 'error');
            }
          });
        },
        loadTask(task) {
          this.title = task.title || '';
          this.state = task.state;
          this.selectedColor = this.stateColors[task.state]?.card || 'bg-amber-50';
          document.getElementById('contentEditor').innerHTML = this.stripChecklist(task.content || '');
          this.parseContent(task.content || '');
        },
        stripChecklist(html) {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          temp.querySelectorAll('li[data-checklist]').forEach(li => li.remove());
          temp.querySelectorAll('checklist-pos').forEach(el => el.remove());
          return temp.innerHTML;
        },
        parseContent(html) {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          this.checklistItems = [];
          temp.querySelectorAll('li[data-checklist]').forEach(li => {
            const ci = li.dataset.ci;
            const item = {
              text: li.textContent,
              checked: li.dataset.checked === 'true',
              editing: false
            };
            if (ci !== undefined && !ci.startsWith('inline-')) {
              item._idx = parseInt(ci, 10);
            }
            this.checklistItems.push(item);
          });
        },
        loadContacts() {
          if (!this.taskId) return;
          fetch('api/tasks/contacts.php?task_id=' + this.taskId)
            .then(res => res.json())
            .then(data => { if (data.data) this.contacts = data.data; });
        },
        addContact() {
          if (!this.newContact.name || !this.newContact.phone) return;
          fetch('api/tasks/contacts.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: parseInt(this.taskId), name: this.newContact.name, phone: this.newContact.phone })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              this.contacts.push({ id: data.data.id, name: this.newContact.name, phone: this.newContact.phone });
              this.newContact = { name: '', phone: '' };
              this.showContactModal = false;
            }
          });
        },
        removeContact(idx) {
          const c = this.contacts[idx];
          if (!c.id) return;
          fetch('api/tasks/contacts.php', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: c.id })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) this.contacts.splice(idx, 1);
          });
        },
        importFromPhone() {
          if ('contacts' in navigator && 'select' in navigator.contacts) {
            navigator.contacts.select(['name', 'tel'], { multiple: false })
              .then(contacts => {
                if (contacts.length > 0) {
                  this.newContact.name = contacts[0].name[0];
                  this.newContact.phone = contacts[0].tel[0];
                }
              })
              .catch(() => {});
          } else {
            alert('Web Contact API tidak didukung di browser ini. Silakan isi manual.');
          }
        },
        execCmd(cmd) {
          document.execCommand(cmd, false, null);
          document.getElementById('contentEditor').focus();
        },
        addChecklistItem() {
          const sel = window.getSelection();
          const editor = document.getElementById('contentEditor');
          if (sel && sel.rangeCount > 0 && sel.toString().trim()) {
            const range = sel.getRangeAt(0);
            if (editor.contains(range.commonAncestorContainer)) {
              const text = sel.toString().trim();
              range.deleteContents();
              const idx = this._nextIdx++;
              const marker = document.createElement('checklist-pos');
              marker.setAttribute('data-ci', idx);
              range.insertNode(marker);
              sel.removeAllRanges();
              this.checklistItems.push({ text, checked: false, editing: false, _idx: idx });
              return;
            }
          }
          const idx = this._nextIdx++;
          this.checklistItems.push({ text: 'Item baru', checked: false, editing: true, _idx: idx });
          const marker = document.createElement('checklist-pos');
          marker.setAttribute('data-ci', idx);
          editor.appendChild(marker);
        },
        removeChecklist(idx) {
          this.checklistItems.splice(idx, 1);
        },
        updateContent() {
          // content gets saved from innerHTML
        },
        changeState(newState) {
          this.state = newState;
          this.selectedColor = this.stateColors[newState].card;
        },
        stateClasses(value) {
          return this.stateColors[value].btn + (this.state === value ? ' ring-2 ring-offset-1' : '');
        },
        buildContent() {
          let html = document.getElementById('contentEditor').innerHTML;
          const itemsByIdx = {};
          this.checklistItems.forEach(item => {
            if (item._idx !== undefined) itemsByIdx[item._idx] = item;
          });
          if (this._nextIdx > 0) {
            for (let i = 0; i < this._nextIdx; i++) {
              const marker = `<checklist-pos data-ci="${i}"></checklist-pos>`;
              if (itemsByIdx[i]) {
                const item = itemsByIdx[i];
                const li = `<li data-checklist="true" data-ci="${i}" data-checked="${item.checked}" class="${item.checked ? 'checked-item' : ''}">${item.text}</li>`;
                html = html.replace(marker, li);
              } else {
                html = html.replace(marker, '');
              }
            }
          }
          const unmarked = this.checklistItems.filter(item => item._idx === undefined);
          unmarked.forEach((item, idx) => {
            html += `<li data-checklist="true" data-ci="inline-${idx}" data-checked="${item.checked}" class="${item.checked ? 'checked-item' : ''}">${item.text}</li>`;
          });
          return html;
        },
        saveTask() {
          const content = this.buildContent();
          const url = this.taskId ? 'api/tasks/update.php' : 'api/tasks/create.php';
          const body = this.taskId
            ? { id: parseInt(this.taskId), title: this.title, content, state: this.state }
            : { title: this.title, content, state: this.state };

          fetch(url, {
            method: this.taskId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) {
              if (this.taskId) {
                this.showToast('Task disimpan', 'success');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
              } else {
                window.location.href = 'task.html?id=' + data.data.id;
              }
            }
          });
        },
        htmlToWhatsApp(html) {
          const div = document.createElement('div');
          div.innerHTML = html;
          const checklistLines = [];
          div.querySelectorAll('li[data-checklist]').forEach(li => {
            const checked = li.dataset.checked === 'true';
            const text = li.textContent;
            checklistLines.push(`- [${checked ? 'x' : ' '}] ${text}`);
          });
          div.querySelectorAll('li[data-checklist]').forEach(li => li.remove());
          div.querySelectorAll('checklist-pos').forEach(el => el.remove());
          const convertNode = (node) => {
            let result = '';
            for (const child of node.childNodes) {
              if (child.nodeType === Node.TEXT_NODE) {
                result += child.textContent;
              } else if (child.nodeType === Node.ELEMENT_NODE) {
                const tag = child.tagName.toLowerCase();
                const inner = convertNode(child);
                switch (tag) {
                  case 'b': case 'strong': result += `*${inner}*`; break;
                  case 'i': case 'em': {
                    const pad = result.length > 0 && !result.endsWith(' ') && !result.endsWith('\n') ? ' ' : '';
                    result += `${pad}_${inner}_ `;
                    break;
                  }
                  case 's': case 'del': case 'strike': result += `~${inner}~`; break;
                  case 'u': result += inner; break;
                  case 'br': result += '\n'; break;
                  case 'li': result += `- ${inner}\n`; break;
                  case 'p': case 'div': result += inner + '\n'; break;
                  default: result += inner; break;
                }
              }
            }
            return result;
          };
          const mainText = convertNode(div).trim();
          return [mainText, ...checklistLines].filter(Boolean).join('\n');
        },
        copyCurrentTask() {
          this.openMenu = false;
          const txt = (this.title || 'Task') + '\n\n' + this.htmlToWhatsApp(this.buildContent());
          const done = () => this.showToast('Disalin ke clipboard', 'success');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(txt).then(done);
          } else {
            const ta = document.createElement('textarea');
            ta.value = txt;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            done();
          }
        },
        deleteTask() {
          if (!this.taskId || !confirm('Hapus task ini?')) return;
          fetch('api/tasks/delete.php', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: parseInt(this.taskId) })
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) window.location.href = 'dashboard.html';
          });
        },
        goBack() {
          window.location.href = 'dashboard.html';
        },
        toggleTheme() {
          this.theme = this.theme === 'light' ? 'dark' : 'light';
          localStorage.setItem('theme', this.theme);
          document.documentElement.classList.toggle('dark', this.theme === 'dark');
        }
      }
    }
  </script>
</body>
